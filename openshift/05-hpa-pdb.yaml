# ──────────────────────────────────────────────────────────────────
# HorizontalPodAutoscaler — scale on CPU & memory
# ──────────────────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: claim-finalization-agent-hpa
  namespace: healthcare-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: claim-finalization-agent
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300

---
# ──────────────────────────────────────────────────────────────────
# PodDisruptionBudget — maintain availability during node drains
# ──────────────────────────────────────────────────────────────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: claim-finalization-agent-pdb
  namespace: healthcare-prod
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: claim-finalization-agent

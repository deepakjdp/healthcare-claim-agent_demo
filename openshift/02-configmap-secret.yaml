# ──────────────────────────────────────────────────────────────────
# ConfigMap — non-sensitive application configuration
# ──────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: claim-agent-config
  namespace: healthcare-prod
  labels:
    app: claim-finalization-agent
data:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  COINSURANCE_RATE: "0.80"
  FRAUD_THRESHOLD: "60"
  MAX_BILLED_AMOUNT: "50000"

---
# ── Secret — sensitive credentials (base64-encoded placeholder values) ──
# In production use: OpenShift Secrets / HashiCorp Vault / AWS Secrets Manager
apiVersion: v1
kind: Secret
metadata:
  name: claim-agent-secrets
  namespace: healthcare-prod
  labels:
    app: claim-finalization-agent
type: Opaque
stringData:
  DB_CONNECTION_STRING: "postgresql://claimdb:5432/claims"
  DB_PASSWORD: "REPLACE_WITH_VAULT_REFERENCE"
  BROKER_URL: "amqps://claims-broker:5671"
  BROKER_PASSWORD: "REPLACE_WITH_VAULT_REFERENCE"
